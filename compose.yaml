name: utility-in-life

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.production}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    command: ["postgres", "-c", "shared_buffers=96MB", "-c", "max_connections=40"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 300m
    logging: &default-logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: ./backend
    restart: unless-stopped
    init: true
    env_file:
      - .env.production
      - .env.payhero
    depends_on:
      db:
        condition: service_healthy
    command:
      - /bin/sh
      - -ec
      - |
        python manage.py migrate --noinput
        python manage.py collectstatic --noinput
        exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 1 --worker-class gthread --threads 2 --timeout 60 --max-requests 1000 --max-requests-jitter 100 --no-control-socket --access-logfile - --error-logfile -
    expose:
      - "8000"
    volumes:
      - static_files:/app/staticfiles
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/api/v1/health/', headers={'Host':'utilapi.oxlabs.co.ke','X-Forwarded-Proto':'https'}), timeout=4)"
      interval: 20s
      timeout: 6s
      start_period: 45s
      retries: 5
    mem_limit: 320m
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=24m,mode=1777

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
      - static_files:/usr/share/nginx/html/static:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 64m
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m
      - /var/run:size=1m
      - /tmp:size=4m

  certbot:
    image: certbot/certbot:v5.8.0
    profiles:
      - certificates
    entrypoint: ["certbot"]
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    logging: *default-logging

volumes:
  postgres_data:
  static_files:
  letsencrypt:
  certbot_webroot:
